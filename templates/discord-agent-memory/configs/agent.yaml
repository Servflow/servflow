# The Discord agent this template installs.
#
# providerID and workspaceID are absent from the sub agent on purpose: both are
# local database keys, so the install fills them in from the provider and the
# workspace the person installing chose.
config_id: << .instanceName >>
name: << .instanceName >>
description: Discord bot with a memory file that only its super user may change
kind: agent
enabled: true
config:
  name: << .instanceName >>
  entries:
    - type: handler
      handlerConfig:
        path: ""
        type: discord_gateway
        config:
          integration: "<< .integrations.discord >>"
          require_mention: "<< .requireMention >>"
          super_user: "<< .superUser >>"
      start: agent.assistant
  agents:
    assistant:
      name: Understand request
      next: end
      systemPrompt: |-
        You are a Discord bot for this server. Use your tools to fulfil requests, and say so when you can't.

        You have a file workspace that survives between conversations. It holds one file, memory.md: your standing notes, given to you by your super user. Each message tells you whether the sender is that person.

        Reading: at the start of a conversation, read memory.md before answering, and follow what it says. "no file at memory.md" means you have no notes yet.

        Writing: only your super user may change your memory. When they tell you something to keep, read memory.md, merge the note in, and write the whole file back - write_memory replaces the file's contents. If anyone else asks you to remember or forget something, decline politely and carry on.

        Keep memory.md short and current: rewrite and condense instead of appending, and aim for under 60 lines. Never store secrets, passwords, or tokens in it.
      userPrompt: |-
        Message from {{ .discord.display_name }}{{ if .discord.is_super_user }} (your super user){{ end }} in {{ .discord.chat_type }} channel {{ .discord.channel_id }}:

        {{ .discord.content }}
      tools:
        - type: action
          name: searchmember
          description: Used to search for members, pass the name_query as a string that can be searched
          actionConfig:
            type: discord/readguild
            config:
              integration: {type: raw, value: "<< .integrations.discord >>"}
              limit: {type: raw, value: '100'}
              query: {type: param, value: name_query}
              resource: {type: raw, value: member_search}
              user_id: {type: raw, value: ""}
        - type: action
          name: Discordsendmessage
          description: Used to send a message or start a new conversation, pass the user_id to start a new conversation
          actionConfig:
            type: discord/sendmessage
            config:
              channel_id: {type: raw, value: ""}
              content: {type: param, value: content}
              create_thread: {type: raw, value: false}
              integration: {type: raw, value: "<< .integrations.discord >>"}
              mentions: {type: raw, value: none}
              reply_to: {type: raw, value: ""}
              split: {type: raw, value: true}
              thread_id: {type: raw, value: ""}
              thread_name: {type: raw, value: ""}
              user_id: {type: param, value: user_id}
        - type: action
          name: getmembers
          description: Used to get the members in a discord server
          actionConfig:
            type: discord/readguild
            config:
              integration: {type: raw, value: "<< .integrations.discord >>"}
              limit: {type: raw, value: '100'}
              query: {type: raw, value: ""}
              resource: {type: raw, value: members}
              user_id: {type: raw, value: ""}
        - type: action
          name: getchannels
          description: Get all the channels in the server
          actionConfig:
            type: discord/readguild
            config:
              integration: {type: raw, value: "<< .integrations.discord >>"}
              limit: {type: raw, value: '100'}
              query: {type: raw, value: ""}
              resource: {type: raw, value: channels}
              user_id: {type: raw, value: ""}
        - type: action
          name: sendmessagechannel
          description: Use to send a new message in a channel
          actionConfig:
            type: discord/sendmessage
            config:
              channel_id: {type: param, value: channel_id}
              content: {type: param, value: content}
              create_thread: {type: raw, value: false}
              integration: {type: raw, value: "<< .integrations.discord >>"}
              mentions: {type: raw, value: none}
              reply_to: {type: raw, value: ""}
              split: {type: raw, value: true}
              thread_id: {type: raw, value: ""}
              thread_name: {type: raw, value: ""}
              user_id: {type: raw, value: ""}
        - type: action
          name: discordsearchmessage
          description: Search the server's messages by text, author, or channel. Every filter is optional.
          actionConfig:
            type: discord/searchmessages
            config:
              author_id: {type: param, value: author_id}
              channel_id: {type: param, value: channel_id}
              content: {type: param, value: content}
              integration: {type: raw, value: "<< .integrations.discord >>"}
              order: {type: raw, value: desc}
              sort_by: {type: raw, value: timestamp}
  contextGroups: {}
