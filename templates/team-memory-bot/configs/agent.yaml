# The two-app memory bot this template installs.
#
# providerID and workspaceID are absent from the sub agent on purpose: both are
# local database keys, so the install fills them in from the provider and the
# workspace the person chose. The workspace is the memory both apps share.
#
# Two entries start the same agent. Only the variables of the app that
# delivered the message exist on a run, so the prompt reads each app inside
# its own `with`. The Discord entry's step reads the channel's recent messages;
# a Telegram chat's own thread already is its history. Step ids share one
# namespace across entries, hence the dc_ prefix.
config_id: << .instanceName >>
name: << .instanceName >>
description: One assistant on Telegram and Discord with a shared memory only its owner can change
kind: agent
enabled: true
config:
  name: << .instanceName >>
  entries:
    - type: handler
      handlerConfig:
        path: /telegram/<< .instanceName >>
        type: telegram_webhook
        config:
          integration: "<< .integrations.telegram >>"
          require_mention: << .telegramMention | json >>
          ignore_bots: "true"
          typing: "true"
      start: agent.assistant
    - type: handler
      handlerConfig:
        path: ""
        type: discord_gateway
        config:
          integration: "<< .integrations.discord >>"
          require_mention: "true"
          super_user: << .discordOwner | json >>
      steps:
        - id: dc_recent
          type: discord/readmessages
          config:
            integration: "<< .integrations.discord >>"
            channel_id: "{{ .discord.channel_id }}"
            limit: "20"
      start: agent.assistant
  agents:
    assistant:
      name: Assistant
      next: end
      systemPrompt: |-
        << .persona | indent 8 >>

        You answer on Telegram and on Discord. Each message says which app it came from and whether the sender is your owner.

        ## Memory

        You have a file workspace that survives between conversations and is the same on both apps. It holds one file, memory.md: your standing notes.

        - At the start of a conversation, read memory.md and follow what it says. "no file at memory.md" means you have no notes yet.
        - Only your owner may change your memory. When they tell you something to keep, read memory.md, merge the note in, and write the whole file back: write_memory replaces the file.
        - If anyone else asks you to remember or forget something, decline politely and carry on.
        - Keep memory.md short and current, under 60 lines. Never store passwords, tokens, or other secrets in it.

        ## Answers

        Keep answers short: a couple of sentences unless more was asked for. On Telegram write plain text, because markdown is not rendered there. On Discord you may use Discord markdown.
      userPrompt: |-
        {{ with .telegram }}Telegram message from {{ escape (tostring .first_name) }}{{ if eq (printf "%d" .user_id) << .telegramOwner | json >> }} (your owner){{ end }}:

        {{ escape (tostring .text) }}{{ end }}{{ with .discord }}Discord message from {{ escape (tostring .display_name) }}{{ if .is_super_user }} (your owner){{ end }} in channel {{ .channel_id }}:

        {{ escape (tostring .content) }}{{ end }}{{ with .dc_recent }}

        The channel's recent messages (JSON):
        {{ escape (jsonout .messages) }}{{ end }}
